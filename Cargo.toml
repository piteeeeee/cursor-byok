[workspace]
members = [
    "server",
    "apps/menubar",
]
resolver = "2"

# Keep local Rust builds compact. Full dependency debug info and incremental
# object caches dominate target/ in this workspace, while line tables for our
# own crates are enough for normal backtraces and source-level debugging.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

# The menu bar app is a single shipped binary; smaller and faster to load.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
