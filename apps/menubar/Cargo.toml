# The native macOS menu bar process: one binary, no web view.
[package]
name = "cursor-byok-lite"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cursor BYOK Lite: a native macOS menu bar app that hosts the Cursor proxy in-process"

[dependencies]
cursor-server = { path = "../../server" }
libc = "0.2"
muda = "0.19"
png = "0.18"
tao = { version = "0.35", features = ["rwh_06"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24"
